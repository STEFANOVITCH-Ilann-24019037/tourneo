name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]   # ou "master" selon votre branche par défaut
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'   # 👈 C'est le dossier à déployer

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
