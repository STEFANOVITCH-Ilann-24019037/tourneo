name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]   # si votre branche par défaut est "master", remplacez "main" par "master"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'   # 👈 dossier contenant votre site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
